<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMD: Real vs AI Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .imd-blue {
            background-color: #003366;
        }

        .imd-text-blue {
            color: #003366;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background-color: white;
            min-height: 100vh;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            #app-container {
                min-height: 800px;
                border-radius: 12px;
                margin: 20px 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .img-container {
            width: 100%;
            height: 350px;
            background-color: #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="app-container" class="flex flex-col">
        <!-- Header -->
        <div class="imd-blue text-white p-4 text-center font-bold text-xl tracking-wider shadow-md z-10">
            IMD AI CHALLENGE
        </div>

        <!-- Main Content Area -->
        <div id="screen-content" class="flex-grow p-6 flex flex-col fade-in">
            <!-- Content injected by JS -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const APPS_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        // Dataset for the game (Real vs AI)
        const dataset = [
            { id: 1, url: './images/01_real.jpg', answer: 'Real', title: 'Wheat Field with Cypresses', artist: 'Vincent van Gogh (1889)', source: 'The Metropolitan Museum of Art', hint: 'Thick impasto texture with expressive swirling brush strokes.' },
            { id: 2, url: './images/02_ai.jpg', answer: 'AI', title: 'Futuristic Organic Sculpture', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'The background blurs unnaturally into the iridescent floating sculpture.' },
            { id: 3, url: './images/03_real.jpg', answer: 'Real', title: 'Gray Weather, Grande Jatte', artist: 'Georges Seurat (ca. 1888)', source: 'The Metropolitan Museum of Art', hint: 'Pointillism masterpiece created with meticulous tiny dots of paint.' },
            { id: 4, url: './images/04_ai.jpg', answer: 'AI', title: 'The Infinite Library of Babel', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'Impossible staircase geometry and perspective twists in the lower arches.' },
            { id: 5, url: './images/05_real.jpg', answer: 'Real', title: 'The Abduction of the Sabine Women', artist: 'Nicolas Poussin (1634)', source: 'The Metropolitan Museum of Art', hint: 'Classical Baroque figurative composition with natural human musculature.' },
            { id: 6, url: './images/06_ai.jpg', answer: 'AI', title: 'Portrait of the Renaissance Scholar', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'Contradictory shadow directions: light enters from the window but shadows cast backward.' },
            { id: 7, url: './images/07_real.jpg', answer: 'Real', title: 'The Great Wave off Kanagawa', artist: 'Katsushika Hokusai (1832)', source: 'The Metropolitan Museum of Art', hint: 'Traditional Japanese woodblock print with masterfully carved contour lines.' },
            { id: 8, url: './images/08_ai.jpg', answer: 'AI', title: 'Alice and Sparkle (Claw Hand)', artist: 'Midjourney v3 (2022)', source: 'Wikimedia / Midjourney', hint: 'Famous early AI anatomical glitch: unnatural claw-like fingers.' },
            { id: 9, url: './images/09_real.jpg', answer: 'Real', title: 'Self-Portrait with a Straw Hat', artist: 'Vincent van Gogh (1887)', source: 'The Metropolitan Museum of Art', hint: 'Rhythmic directional brushstrokes applied with pure pigment.' },
            { id: 10, url: './images/10_ai.png', answer: 'AI', title: 'Cosmic Swimming Pool', artist: 'Midjourney', source: 'Wikimedia Commons', hint: 'Hyper-saturated surreal dreamscape blending cosmic nebulae into water.' },
            { id: 11, url: './images/11_real.jpg', answer: 'Real', title: 'Young Woman with a Water Pitcher', artist: 'Johannes Vermeer (1662)', source: 'The Metropolitan Museum of Art', hint: 'Subtle physics of window light filtering through leaded stained glass.' },
            { id: 12, url: './images/12_ai.png', answer: 'AI', title: 'Dark Castle with Dragon', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Gothic fantasy rendered with seamless digital diffusion lighting.' },
            { id: 13, url: './images/13_real.jpg', answer: 'Real', title: 'Bridge over a Pond of Water Lilies', artist: 'Claude Monet (1899)', source: 'The Metropolitan Museum of Art', hint: 'Authentic plein-air Impressionist layered dabs of color.' },
            { id: 14, url: './images/14_ai.png', answer: 'AI', title: 'Mechanical Steampunk Dove', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Intricate clockwork feathers with subtle geometric inconsistencies.' },
            { id: 15, url: './images/15_real.jpg', answer: 'Real', title: 'Shoes', artist: 'Vincent van Gogh (1888)', source: 'The Metropolitan Museum of Art', hint: 'Heavy textural impasto on worn leather shoes with organic paint distress.' },
            { id: 16, url: './images/16_ai.png', answer: 'AI', title: 'Old Castle Panorama', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Panoramic landscape where architectural battlements melt into the cliffs.' },
            { id: 17, url: './images/17_real.jpg', answer: 'Real', title: 'The Death of Socrates', artist: 'Jacques Louis David (1787)', source: 'The Metropolitan Museum of Art', hint: 'Rigorous Neoclassical anatomy, linear perspective, and controlled drapery.' },
            { id: 18, url: './images/18_ai.png', answer: 'AI', title: 'Little Ice Bear in Snow', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Sub-surface fur scatter and stylized eyes typical of diffusion rendering.' },
            { id: 19, url: './images/19_real.jpg', answer: 'Real', title: 'Blind Orion Searching for the Rising Sun', artist: 'Nicolas Poussin (1658)', source: 'The Metropolitan Museum of Art', hint: 'Atmospheric mist and layered receding classical landscape depth.' },
            { id: 20, url: './images/20_ai.png', answer: 'AI', title: 'Abstract Organic Architecture', artist: 'Midjourney', source: 'Wikimedia Commons', hint: 'Biomorphic flowing geometry that defies standard structural engineering.' }
        ];

        // Mock Leaderboard Database (Provides immediate local feedback before sheet sync)
        let leaderboardDB = [
            { name: 'AI_Master', score: 450, time: 25.1 },
            { name: 'ArtCritic', score: 420, time: 28.5 }
        ];

        // Game State
        let state = {
            screen: 'ONBOARDING', // ONBOARDING, PLAYING, SYNCING, LEADERBOARD
            nickname: '',
            score: 0,
            currentIndex: 0,
            startTime: 0,
            timerInterval: null,
            timeElapsed: 0
        };

        const contentDiv = document.getElementById('screen-content');

        // --- Screen Renderers ---

        function renderOnboarding() {
            contentDiv.innerHTML = `
            <div class="flex-grow flex flex-col justify-center text-center fade-in">
                <h1 class="text-3xl font-bold imd-text-blue mb-2">Real or AI?</h1>
                <p class="text-gray-600 mb-8">Can you spot the difference between human mastery and algorithmic perfection?</p>
                
                <div class="bg-gray-50 p-6 rounded-lg border border-gray-200 mb-8">
                    <label class="block text-left text-sm font-semibold text-gray-700 mb-2">Enter Nickname</label>
                    <input type="text" id="nickname-input" placeholder="e.g. CyberSamurai" maxlength="15" 
                           class="w-full px-4 py-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-900 text-lg">
                </div>

                <button onclick="startGame()" class="imd-blue text-white font-bold py-4 px-8 rounded-lg shadow-lg hover:bg-blue-800 transition transform hover:-translate-y-1 text-lg w-full">
                    START THE CLOCK
                </button>
            </div>
        `;
        }

        function renderPlaying() {
            const item = dataset[state.currentIndex];

            contentDiv.innerHTML = `
            <div class="fade-in h-full flex flex-col">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-4">
                    <div class="text-sm font-semibold text-gray-500">Player: <span class="imd-text-blue">${state.nickname}</span></div>
                    <div class="text-sm font-bold bg-gray-200 px-3 py-1 rounded-full"><span id="timer-display">0.0</span>s</div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
                    <div class="imd-blue h-2 rounded-full transition-all duration-300" style="width: ${((state.currentIndex) / dataset.length) * 100}%"></div>
                </div>

                <!-- Image -->
                <div class="img-container shadow-md">
                    <img src="${item.url}" alt="Artwork ${state.currentIndex + 1}">
                </div>
                
                <div class="flex justify-between items-center text-xs text-gray-500 mb-2 px-1">
                    <span class="uppercase tracking-widest text-gray-400 font-semibold">Artwork ${state.currentIndex + 1} of ${dataset.length}</span>
                    <button onclick="toggleHint()" id="hint-btn" class="text-blue-700 font-semibold hover:underline flex items-center gap-1">
                        💡 Need a hint?
                    </button>
                </div>
                <div id="hint-box" class="hidden text-xs text-gray-700 bg-blue-50 border border-blue-200 p-2.5 rounded mb-4 fade-in">
                    ${item.hint}
                </div>

                <!-- Actions -->
                <div class="flex gap-4 mt-auto mb-4">
                    <button onclick="makeGuess('Real')" class="flex-1 bg-white border-2 border-[#003366] imd-text-blue font-bold py-4 rounded-lg hover:bg-gray-50 transition text-lg shadow-sm">
                        🧑‍🎨 REAL
                    </button>
                    <button onclick="makeGuess('AI')" class="flex-1 imd-blue text-white font-bold py-4 rounded-lg hover:bg-blue-800 transition text-lg shadow-sm">
                        🤖 AI
                    </button>
                </div>
            </div>
        `;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            if (hintBox) {
                const isHidden = hintBox.classList.contains('hidden');
                hintBox.classList.toggle('hidden');
                hintBtn.innerText = isHidden ? '🙈 Hide hint' : '💡 Need a hint?';
            }
        }

        function toggleCreditsModal() {
            let modal = document.getElementById('credits-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'credits-modal';
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in';
                
                const listHtml = dataset.map((d, i) => `
                    <div class="p-2.5 border-b border-gray-100 flex items-start gap-3 text-xs">
                        <span class="font-bold text-gray-400 w-5">${i + 1}.</span>
                        <div class="flex-grow">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-gray-900">${d.title}</span>
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${d.answer === 'Real' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800'}">${d.answer}</span>
                            </div>
                            <div class="text-gray-500">${d.artist} • <span class="italic text-gray-400">${d.source}</span></div>
                        </div>
                    </div>
                `).join('');

                modal.innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden">
                        <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wide">Artwork Dataset & Credits</h3>
                            <button onclick="toggleCreditsModal()" class="text-gray-400 hover:text-gray-600 text-lg font-bold">✕</button>
                        </div>
                        <div class="overflow-y-auto flex-grow p-2">
                            ${listHtml}
                        </div>
                        <div class="p-3 border-t border-gray-100 text-center bg-gray-50">
                            <button onclick="toggleCreditsModal()" class="imd-blue text-white text-xs font-semibold px-4 py-2 rounded-lg">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } else {
                modal.classList.toggle('hidden');
            }
        }

        function renderSyncing() {
            contentDiv.innerHTML = `
            <div class="flex-grow flex flex-col justify-center items-center text-center fade-in">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-[#003366] mb-6"></div>
                <h2 class="text-xl font-bold imd-text-blue">Calculating Score...</h2>
                <p class="text-gray-500 mt-2">Syncing to Google Sheets leaderboard.</p>
            </div>
        `;
        }

        function renderLeaderboard() {
            // Sort leaderboard
            leaderboardDB.sort((a, b) => b.score - a.score);

            let leaderboardHTML = leaderboardDB.slice(0, 5).map((entry, index) => `
            <div class="flex justify-between items-center p-3 ${entry.name === state.nickname ? 'bg-blue-50 border border-blue-200 font-bold' : 'border-b border-gray-100'} rounded mb-1">
                <div class="flex items-center gap-3">
                    <span class="text-gray-400 font-mono w-4">${index + 1}.</span>
                    <span class="${entry.name === state.nickname ? 'imd-text-blue' : 'text-gray-700'}">${entry.name}</span>
                </div>
                <div class="text-right">
                    <div class="text-gray-900">${entry.score} <span class="text-xs text-gray-500 font-normal">pts</span></div>
                </div>
            </div>
        `).join('');

            const timeBonus = Math.max(0, Math.floor((30 - state.timeElapsed) * 10));

            contentDiv.innerHTML = `
            <div class="fade-in flex flex-col h-full">
                <div class="text-center mb-4">
                    <div class="text-4xl mb-1">🏆</div>
                    <h2 class="text-2xl font-bold imd-text-blue mb-1">Challenge Complete!</h2>
                    <p class="text-gray-500 text-sm">Time: ${state.timeElapsed} seconds</p>
                </div>

                <div class="bg-gray-900 text-white p-5 rounded-xl text-center shadow-lg mb-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-2 opacity-10">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                    </div>
                    <div class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Total Score</div>
                    <div class="text-4xl font-bold text-white mb-1">${state.score}</div>
                    <div class="text-xs text-green-400 font-medium">Includes +${timeBonus} speed bonus!</div>
                </div>

                <h3 class="font-bold text-gray-800 uppercase tracking-wide text-xs mb-2 px-1">Live Leaderboard</h3>
                <div class="bg-white rounded-lg border border-gray-200 mb-4 max-h-40 overflow-y-auto">
                    ${leaderboardHTML}
                </div>

                <div class="flex flex-col gap-2 mt-auto">
                    <button onclick="resetApp()" class="w-full imd-blue text-white font-bold py-3.5 rounded-lg hover:bg-blue-800 transition shadow text-base">
                        PLAY AGAIN
                    </button>
                    <button onclick="toggleCreditsModal()" class="w-full bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-lg hover:bg-gray-200 transition text-xs flex items-center justify-center gap-1.5">
                        📜 View Artwork Answers & Credits
                    </button>
                </div>
            </div>
        `;
        }

        // --- Logic ---

        function startGame() {
            const input = document.getElementById('nickname-input').value.trim();
            if (!input) {
                // Using a simple alert for demo purposes, but in production, a custom modal is better
                alert("Please enter a nickname!");
                return;
            }

            state.nickname = input;
            state.score = 0;
            state.currentIndex = 0;
            state.startTime = Date.now();
            state.screen = 'PLAYING';

            // Start Timer
            state.timerInterval = setInterval(updateTimer, 100);

            renderPlaying();
        }

        function updateTimer() {
            if (state.screen !== 'PLAYING') return;
            const now = Date.now();
            state.timeElapsed = ((now - state.startTime) / 1000).toFixed(1);
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                timerEl.innerText = state.timeElapsed;
            }
        }

        function makeGuess(guess) {
            const currentItem = dataset[state.currentIndex];

            // Base score for correct answer
            if (guess === currentItem.answer) {
                state.score += 100;
            }

            state.currentIndex++;

            if (state.currentIndex >= dataset.length) {
                endGame();
            } else {
                renderPlaying();
            }
        }

        async function endGame() {
            clearInterval(state.timerInterval);
            state.screen = 'SYNCING';
            renderSyncing();

            // Calculate final score with speed bonus (assumes a 30 second par time)
            const timeBonus = Math.max(0, Math.floor((30 - parseFloat(state.timeElapsed)) * 10));
            state.score += timeBonus;

            const payload = {
                nickname: state.nickname,
                score: state.score,
                time: state.timeElapsed,
                timestamp: new Date().toISOString()
            };

            try {
                // Send data to Google Sheets via Apps Script Web App
                if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Prevents browser CORS blocks for simple one-way logging
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // Simulate network delay if URL isn't set yet (for testing)
                    await new Promise(resolve => setTimeout(resolve, 1200));
                }
            } catch (error) {
                console.error("Error saving to Google Sheets:", error);
            }

            // Save locally so the user instantly sees their score on their screen
            leaderboardDB.push({
                name: state.nickname,
                score: state.score,
                time: state.timeElapsed
            });

            state.screen = 'LEADERBOARD';
            renderLeaderboard();
        }

        function resetApp() {
            state = {
                screen: 'ONBOARDING',
                nickname: '',
                score: 0,
                currentIndex: 0,
                startTime: 0,
                timerInterval: null,
                timeElapsed: 0
            };
            renderOnboarding();
        }

        // Init
        renderOnboarding();
    </script>

</body>

</html>
