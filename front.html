<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMD Tech Community Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .imd-blue {
            background-color: #001E62;
        }

        .imd-text-blue {
            color: #001E62;
        }

        .btn-action-primary {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.025em;
            border-radius: 8px;
            transition: all 0.15s ease-in-out;
        }
        .btn-action-primary:active {
            transform: scale(0.985);
        }

        /* Pure white inversion for IMD official logo on dark navy header */
        .imd-logo-white {
            filter: brightness(0) invert(1);
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background-color: white;
            min-height: 100vh;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            #app-container {
                min-height: 800px;
                border-radius: 12px;
                margin: 20px 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .img-container {
            width: 100%;
            height: 350px;
            background-color: #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="app-container" class="flex flex-col">
        <!-- Header with official IMD Logo -->
        <div class="imd-blue text-white p-3 font-bold text-xs tracking-wider shadow-md z-10 flex justify-between items-center px-4">
            <div onclick="resetApp()" class="flex items-center gap-2 cursor-pointer">
                <img src="./images/imd_logo.png" alt="IMD" class="h-5 object-contain imd-logo-white">
                <span class="border-l border-white/20 pl-2 text-[11px] font-bold tracking-wider uppercase text-blue-100">Tech Community Challenge</span>
            </div>
            <button onclick="showLeaderboardOnly()" class="text-[10.5px] bg-white/15 hover:bg-white/25 px-2.5 py-1 rounded font-medium transition flex items-center gap-1 shadow-xs ml-2">
                Leaderboard
            </button>
        </div>

        <!-- Sub-header attribution ribbon -->
        <div class="bg-[#001444] text-blue-200 text-[10.5px] py-1.5 px-3 text-center border-b border-blue-900/60 font-medium z-10">
            This challenge is brought to you by <a href="https://www.imd.org/alumni/communities/tech-community/" target="_blank" class="text-amber-300 font-semibold hover:underline">IMD Tech Community, Alumni ↗</a>
        </div>

        <!-- Main Content Area -->
        <div id="screen-content" class="flex-grow p-6 flex flex-col fade-in">
            <!-- Content injected by JS -->
        </div>

        <!-- Persistent Executive Footer -->
        <footer class="mt-auto py-3.5 px-4 bg-gray-50 border-t border-gray-200 text-center z-10">
            <p class="text-[11px] text-gray-800 font-semibold italic mb-2">
                "We empower leaders to thrive in a tech-driven world."
            </p>
            <div class="flex items-center justify-center gap-4 text-xs">
                <a href="https://www.linkedin.com/showcase/imd-tech-community" target="_blank" 
                   class="inline-flex items-center gap-1 font-semibold text-[#003366] hover:text-blue-900 hover:underline">
                    <svg class="w-3.5 h-3.5 fill-current text-[#0077B5]" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.25c-.9 0-1.63.73-1.63 1.63s.73 1.63 1.63 1.63 1.63-.73 1.63-1.63-.73-1.63-1.63-1.63Z"/></svg>
                    Join us on LinkedIn
                </a>
                <span class="text-gray-300">•</span>
                <a href="https://www.imd.org/alumni/communities/tech-community/" target="_blank" 
                   class="inline-flex items-center gap-1 font-semibold text-[#003366] hover:text-blue-900 hover:underline">
                    Learn more
                    <svg class="w-3 h-3 stroke-current fill-none stroke-2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                </a>
            </div>
        </footer>
    </div>

    <script>
        // --- CONFIGURATION ---
        // LIVE GOOGLE APPS SCRIPT WEB APP URL:
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTc5Am7KZwDzBQdg0m2zlHqjfJjbq6QVDxJn740Vtp7JYlIYxjsOW7P2MRldfkahiA/exec';

        // Dataset for the game (Real vs AI)
        const dataset = [
            { id: 1, url: './images/01_real.jpg', answer: 'Real', title: 'Wheat Field with Cypresses', artist: 'Vincent van Gogh (1889)', source: 'The Metropolitan Museum of Art', hint: 'Thick impasto texture with expressive swirling brush strokes.' },
            { id: 2, url: './images/02_ai.jpg', answer: 'AI', title: 'Futuristic Organic Sculpture', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'The background blurs unnaturally into the iridescent floating sculpture.' },
            { id: 3, url: './images/03_real.jpg', answer: 'Real', title: 'Gray Weather, Grande Jatte', artist: 'Georges Seurat (ca. 1888)', source: 'The Metropolitan Museum of Art', hint: 'Pointillism masterpiece created with meticulous tiny dots of paint.' },
            { id: 4, url: './images/04_ai.jpg', answer: 'AI', title: 'The Infinite Library of Babel', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'Impossible staircase geometry and perspective twists in the lower arches.' },
            { id: 5, url: './images/05_real.jpg', answer: 'Real', title: 'The Abduction of the Sabine Women', artist: 'Nicolas Poussin (1634)', source: 'The Metropolitan Museum of Art', hint: 'Classical Baroque figurative composition with natural human musculature.' },
            { id: 6, url: './images/06_ai.jpg', answer: 'AI', title: 'Portrait of the Renaissance Scholar', artist: 'Google Imagen / Gemini AI', source: 'AI Generated', hint: 'Contradictory shadow directions: light enters from the window but shadows cast backward.' },
            { id: 7, url: './images/07_real.jpg', answer: 'Real', title: 'The Great Wave off Kanagawa', artist: 'Katsushika Hokusai (1832)', source: 'The Metropolitan Museum of Art', hint: 'Traditional Japanese woodblock print with masterfully carved contour lines.' },
            { id: 8, url: './images/08_ai.jpg', answer: 'AI', title: 'Alice and Sparkle (Claw Hand)', artist: 'Midjourney v3 (2022)', source: 'Wikimedia / Midjourney', hint: 'Famous early AI anatomical glitch: unnatural claw-like fingers.' },
            { id: 9, url: './images/09_real.jpg', answer: 'Real', title: 'Self-Portrait with a Straw Hat', artist: 'Vincent van Gogh (1887)', source: 'The Metropolitan Museum of Art', hint: 'Rhythmic directional brushstrokes applied with pure pigment.' },
            { id: 10, url: './images/10_ai.png', answer: 'AI', title: 'Cosmic Swimming Pool', artist: 'Midjourney', source: 'Wikimedia Commons', hint: 'Hyper-saturated surreal dreamscape blending cosmic nebulae into water.' },
            { id: 11, url: './images/11_real.jpg', answer: 'Real', title: 'Young Woman with a Water Pitcher', artist: 'Johannes Vermeer (1662)', source: 'The Metropolitan Museum of Art', hint: 'Subtle physics of window light filtering through leaded stained glass.' },
            { id: 12, url: './images/12_ai.png', answer: 'AI', title: 'Dark Castle with Dragon', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Gothic fantasy rendered with seamless digital diffusion lighting.' },
            { id: 13, url: './images/13_real.jpg', answer: 'Real', title: 'Bridge over a Pond of Water Lilies', artist: 'Claude Monet (1899)', source: 'The Metropolitan Museum of Art', hint: 'Authentic plein-air Impressionist layered dabs of color.' },
            { id: 14, url: './images/14_ai.png', answer: 'AI', title: 'Mechanical Steampunk Dove', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Intricate clockwork feathers with subtle geometric inconsistencies.' },
            { id: 15, url: './images/15_real.jpg', answer: 'Real', title: 'Shoes', artist: 'Vincent van Gogh (1888)', source: 'The Metropolitan Museum of Art', hint: 'Heavy textural impasto on worn leather shoes with organic paint distress.' },
            { id: 16, url: './images/16_ai.png', answer: 'AI', title: 'Old Castle Panorama', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Panoramic landscape where architectural battlements melt into the cliffs.' },
            { id: 17, url: './images/17_real.jpg', answer: 'Real', title: 'The Death of Socrates', artist: 'Jacques Louis David (1787)', source: 'The Metropolitan Museum of Art', hint: 'Rigorous Neoclassical anatomy, linear perspective, and controlled drapery.' },
            { id: 18, url: './images/18_ai.png', answer: 'AI', title: 'Little Ice Bear in Snow', artist: 'Midjourney v4', source: 'Wikimedia Commons', hint: 'Sub-surface fur scatter and stylized eyes typical of diffusion rendering.' },
            { id: 19, url: './images/19_real.jpg', answer: 'Real', title: 'Blind Orion Searching for the Rising Sun', artist: 'Nicolas Poussin (1658)', source: 'The Metropolitan Museum of Art', hint: 'Atmospheric mist and layered receding classical landscape depth.' },
            { id: 20, url: './images/20_ai.png', answer: 'AI', title: 'Abstract Organic Architecture', artist: 'Midjourney', source: 'Wikimedia Commons', hint: 'Biomorphic flowing geometry that defies standard structural engineering.' }
        ];

        // Fisher-Yates (Knuth) Shuffle - Pure non-mutating shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Clean Leaderboard Database (stores real participant scores only)
        let leaderboardDB = [];

        try {
            const savedLeaderboard = localStorage.getItem('imd_ai_leaderboard');
            if (savedLeaderboard) {
                // Filter out any initial dummy placeholder names
                const parsed = JSON.parse(savedLeaderboard);
                leaderboardDB = parsed.filter(e => !['AI_Master', 'ArtCritic', 'MuseumCurator'].includes(e.name));
            }
        } catch (e) {
            console.warn('Could not load leaderboard from localStorage', e);
        }

        // Game State
        let state = {
            screen: 'ONBOARDING', // ONBOARDING, PLAYING, SYNCING, LEADERBOARD
            nickname: '',
            score: 0,
            correctCount: 0,
            gameItems: [], // Active randomized session deck
            answers: [], // Stores user choices: { id, guess, correct, item }
            currentIndex: 0,
            startTime: 0,
            timerInterval: null,
            timeElapsed: 0
        };

        const contentDiv = document.getElementById('screen-content');

        // --- Screen Renderers ---

        function renderOnboarding() {
            contentDiv.innerHTML = `
            <div class="flex-grow flex flex-col justify-center text-center fade-in">
                <!-- Brand Identity Watermark / Hero Crest -->
                <div class="w-14 h-14 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xs">
                    <img src="./images/imd_logo.png" alt="IMD" class="h-6 object-contain">
                </div>

                <h1 class="text-2xl font-bold imd-text-blue mb-1 tracking-tight">Real or AI?</h1>
                <div class="text-[11px] uppercase tracking-widest text-gray-400 font-semibold mb-3">Executive Perception Challenge</div>
                
                <p class="text-gray-600 text-xs mb-8 max-w-xs mx-auto leading-relaxed">
                    Can you distinguish between authentic human artistic mastery and state-of-the-art algorithmic synthesis?
                </p>
                
                <div class="bg-gray-50/80 p-4 rounded-xl border border-gray-200 mb-6 text-left shadow-2xs">
                    <label class="block text-[11px] font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Executive Nickname</label>
                    <input type="text" id="nickname-input" placeholder="e.g. ExecutiveLeader" maxlength="15" 
                           class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#001E62] text-sm bg-white">
                </div>

                <button onclick="startGame()" class="btn-action-primary w-full imd-blue text-white hover:bg-[#001444] shadow-md">
                    START THE CLOCK
                </button>

                <button onclick="showLeaderboardOnly()" class="mt-3 w-full bg-white border-2 border-[#001E62] text-[#001E62] font-bold py-2.5 px-4 rounded-lg hover:bg-blue-50 transition text-xs flex items-center justify-center gap-1 shadow-2xs">
                    View Leaderboard
                </button>
            </div>
        `;
        }

        function renderPlaying() {
            const totalItems = state.gameItems && state.gameItems.length > 0 ? state.gameItems.length : dataset.length;
            const item = (state.gameItems && state.gameItems.length > 0) ? state.gameItems[state.currentIndex] : dataset[state.currentIndex];

            contentDiv.innerHTML = `
            <div class="fade-in h-full flex flex-col">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-3">
                    <div class="text-xs font-semibold text-gray-500">Player: <span class="imd-text-blue font-bold">${state.nickname}</span></div>
                    <div class="text-xs font-mono font-bold bg-gray-100 text-gray-700 px-2.5 py-1 rounded"><span id="timer-display">0.0</span>s</div>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-1.5 mb-4">
                    <div class="imd-blue h-1.5 rounded-full transition-all duration-300" style="width: ${((state.currentIndex) / totalItems) * 100}%"></div>
                </div>

                <!-- Image with Curatorial Gallery Framing -->
                <div class="img-container shadow-sm border border-slate-200 rounded-lg overflow-hidden ring-1 ring-black/5">
                    <img src="${item.url}" alt="Artwork ${state.currentIndex + 1}">
                </div>
                
                <div class="flex justify-between items-center text-[10.5px] text-gray-500 mb-3 px-1">
                    <span class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 font-semibold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">
                        Artwork ${state.currentIndex + 1} / ${totalItems}
                    </span>
                    <button onclick="toggleHint()" id="hint-btn" class="text-[#001E62] font-semibold hover:underline flex items-center gap-1">
                        <svg class="w-3 h-3 text-blue-800" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                        Need a hint?
                    </button>
                </div>
                <div id="hint-box" class="hidden text-xs text-gray-700 bg-blue-50 border border-blue-200 p-2.5 rounded mb-4 fade-in">
                    ${item.hint}
                </div>

                <!-- Actions (Unified 52px height) -->
                <div class="flex gap-3 mt-auto mb-2">
                    <button onclick="makeGuess('Real')" class="btn-action-primary flex-1 bg-white border-2 border-[#001E62] imd-text-blue hover:bg-gray-50 shadow-xs">
                        REAL
                    </button>
                    <button onclick="makeGuess('AI')" class="btn-action-primary flex-1 imd-blue text-white hover:bg-[#001444] shadow-xs">
                        AI
                    </button>
                </div>
            </div>
        `;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            if (hintBox) {
                const isHidden = hintBox.classList.contains('hidden');
                hintBox.classList.toggle('hidden');
                hintBtn.innerHTML = isHidden 
                    ? `<svg class="w-3 h-3 text-blue-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Hide hint` 
                    : `<svg class="w-3 h-3 text-blue-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Need a hint?`;
            }
        }

        function toggleCreditsModal() {
            let modal = document.getElementById('credits-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'credits-modal';
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in';
                document.body.appendChild(modal);
            } else if (!modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
                return;
            }

            modal.classList.remove('hidden');

            // Source items: review in the exact order the player encountered them during their game session
            const itemsToReview = (state.answers && state.answers.length > 0)
                ? state.answers.map((a, idx) => ({ ...a.item, answerRecord: a, roundIndex: idx + 1 }))
                : (state.gameItems && state.gameItems.length > 0 ? state.gameItems : dataset).map((d, idx) => ({ ...d, answerRecord: null, roundIndex: idx + 1 }));

            const listHtml = itemsToReview.map((d) => {
                const record = d.answerRecord || (state.answers ? state.answers.find(a => a.id === d.id) : null);
                const userGuess = record ? record.guess : null;
                const wasCorrect = record ? record.correct : null;

                return `
                <div class="p-3 border-b border-gray-100 flex items-start gap-3 text-xs ${wasCorrect === false ? 'bg-red-50/50' : wasCorrect === true ? 'bg-green-50/30' : ''}">
                    <span class="font-bold text-gray-400 w-5 pt-0.5">${d.roundIndex}.</span>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between gap-2 mb-0.5">
                            <span class="font-bold text-gray-900">${d.title}</span>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${d.answer === 'Real' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800'}">Correct: ${d.answer}</span>
                                ${record ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${wasCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${wasCorrect ? 'You: ' + userGuess : 'You: ' + userGuess}</span>` : ''}
                            </div>
                        </div>
                        <div class="text-gray-500">${d.artist} • <span class="italic text-gray-400">${d.source}</span></div>
                    </div>
                </div>
            `;
            }).join('');

            modal.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <div>
                            <h3 class="font-bold text-gray-900 text-sm uppercase tracking-wide">Artworks & Your Answers</h3>
                            <p class="text-[11px] text-gray-500">Green = Correct guess, Red = Missed guess</p>
                        </div>
                        <button onclick="toggleCreditsModal()" class="text-gray-400 hover:text-gray-600 text-lg font-bold">✕</button>
                    </div>
                    <div class="overflow-y-auto flex-grow p-1">
                        ${listHtml}
                    </div>
                    <div class="p-3 border-t border-gray-100 text-center bg-gray-50">
                        <button onclick="toggleCreditsModal()" class="imd-blue text-white text-xs font-semibold px-5 py-2 rounded-lg hover:bg-blue-800 transition">Close</button>
                    </div>
                </div>
            `;
        }

        function renderSyncing() {
            contentDiv.innerHTML = `
            <div class="flex-grow flex flex-col justify-center items-center text-center fade-in py-12">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-[#003366] mb-6"></div>
                <h2 class="text-2xl font-bold imd-text-blue mb-2">Verifying Results...</h2>
                <p class="text-gray-600 text-xs max-w-xs leading-relaxed">
                    Calculating your score and connecting to the live IMD Tech Community leaderboard...
                </p>
            </div>
        `;
        }

        function renderLeaderboard() {
            // Sort leaderboard
            leaderboardDB.sort((a, b) => b.score - a.score);

            let leaderboardHTML = leaderboardDB.length === 0 
                ? '<div class="p-4 text-center text-gray-400 text-xs italic">No scores recorded yet. Be the first!</div>'
                : leaderboardDB.slice(0, 10).map((entry, index) => {
                    const isMe = state.nickname && entry.name && entry.name.toLowerCase() === state.nickname.toLowerCase();
                    const rankMedal = index === 0 ? '1' : index === 1 ? '2' : index === 2 ? '3' : `${index + 1}.`;
                    return `
                    <div class="flex justify-between items-center p-2.5 ${isMe ? 'bg-blue-50 border border-blue-200 font-bold' : 'border-b border-gray-100'} rounded mb-1 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-mono w-5 text-center text-gray-500 font-semibold">${rankMedal}</span>
                            <span class="${isMe ? 'imd-text-blue font-bold' : 'text-gray-800'}">${entry.name}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-gray-900 font-extrabold">${entry.score}</span>
                            <span class="text-[10px] text-gray-500 font-normal">pts</span>
                            ${entry.time ? `<span class="text-[10px] text-gray-400 ml-1">(${entry.time}s)</span>` : ''}
                        </div>
                    </div>
                `;
                }).join('');

            const totalCount = state.gameItems && state.gameItems.length > 0 ? state.gameItems.length : dataset.length;
            const timeBonus = Math.max(0, Math.floor((30 - parseFloat(state.timeElapsed)) * 10));
            const accuracyPercent = Math.round((state.correctCount / totalCount) * 100);

            contentDiv.innerHTML = `
            <div class="fade-in flex flex-col h-full">
                <div class="text-center mb-3">
                    <h2 class="text-xl font-bold imd-text-blue">Challenge Complete</h2>
                    <p class="text-gray-500 text-xs">Total Time: ${state.timeElapsed} seconds</p>
                </div>

                <!-- Detailed Score Breakdown Card -->
                <div class="bg-gradient-to-br from-[#001444] via-[#001E62] to-[#002B88] text-white p-4 rounded-xl text-center shadow-lg mb-3 relative overflow-hidden">
                    <div class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mb-0.5">Your Accuracy</div>
                    
                    <div class="flex items-baseline justify-center gap-1 my-0.5">
                        <span class="text-4xl font-black text-white">${state.correctCount}</span>
                        <span class="text-lg font-medium text-blue-200">/ ${totalCount}</span>
                    </div>
                    
                    <div class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full inline-block mb-3 ${state.correctCount >= 16 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : state.correctCount >= 10 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-red-500/20 text-red-300 border border-red-500/30'}">
                        ${accuracyPercent}% Correct • ${state.correctCount >= 18 ? 'Master Tier' : state.correctCount >= 14 ? 'Advanced Tier' : 'Apprentice Tier'}
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-blue-900/60 text-xs">
                        <div class="bg-blue-950/60 p-1.5 rounded border border-blue-800/40">
                            <div class="text-blue-300 text-[10px]">Artworks Guessed</div>
                            <div class="font-bold text-sm text-white">+${state.correctCount * 100} <span class="text-[9px] font-normal text-blue-300">pts</span></div>
                        </div>
                        <div class="bg-blue-950/60 p-1.5 rounded border border-blue-800/40">
                            <div class="text-blue-300 text-[10px]">Speed Bonus</div>
                            <div class="font-bold text-sm ${timeBonus > 0 ? 'text-amber-300' : 'text-gray-400'}">+${timeBonus} <span class="text-[9px] font-normal text-blue-300">pts</span></div>
                        </div>
                    </div>

                    <div class="mt-2 pt-2 border-t border-blue-900/40 flex justify-between items-center text-xs px-1 text-blue-200">
                        <span class="font-semibold">Final Score:</span>
                        <span class="font-black text-white text-base">${state.score} pts</span>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-1.5 px-1">
                    <h3 class="font-bold text-gray-800 uppercase tracking-wide text-xs">Live Leaderboard</h3>
                    <div class="flex items-center gap-2">
                        <button onclick="showLeaderboardOnly()" class="text-[11px] text-blue-700 hover:text-blue-900 font-semibold hover:underline">
                            View All ↗
                        </button>
                        <span class="text-gray-300">•</span>
                        <button onclick="refreshLeaderboard(this)" class="text-[11px] text-blue-700 hover:text-blue-900 font-semibold flex items-center gap-1 hover:underline">
                            Refresh
                        </button>
                    </div>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 mb-3 max-h-36 overflow-y-auto">
                    ${leaderboardHTML}
                </div>

                <div class="flex flex-col gap-2 mt-auto">
                    <button onclick="resetApp()" class="btn-action-primary w-full imd-blue text-white hover:bg-[#001444] shadow">
                        PLAY AGAIN
                    </button>
                    <button onclick="toggleCreditsModal()" class="w-full bg-blue-50 text-blue-900 border border-blue-200 font-semibold py-2.5 rounded-lg hover:bg-blue-100 transition text-xs flex items-center justify-center gap-1.5">
                        Review Artworks & Answers
                    </button>
                </div>
            </div>
        `;
        }

        async function refreshLeaderboard(btn) {
            if (btn) btn.innerText = 'Loading...';
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                try {
                    const res = await fetch(APPS_SCRIPT_URL);
                    if (res.ok) {
                        const cloudData = await res.json();
                        if (Array.isArray(cloudData) && cloudData.length > 0) {
                            leaderboardDB = cloudData;
                            localStorage.setItem('imd_ai_leaderboard', JSON.stringify(leaderboardDB));
                        }
                    }
                } catch (e) {
                    console.warn('Could not fetch leaderboard:', e);
                }
            }
            renderLeaderboard();
        }

        function showLeaderboardOnly() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.screen = 'LEADERBOARD_ONLY';
            renderLeaderboardOnly();

            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                fetch(APPS_SCRIPT_URL)
                    .then(res => res.json())
                    .then(cloudData => {
                        if (Array.isArray(cloudData) && cloudData.length > 0) {
                            leaderboardDB = cloudData;
                            try {
                                localStorage.setItem('imd_ai_leaderboard', JSON.stringify(leaderboardDB));
                            } catch (e) {}
                            if (state.screen === 'LEADERBOARD_ONLY') {
                                renderLeaderboardOnly();
                            }
                        }
                    })
                    .catch(() => {});
            }
        }

        async function refreshLeaderboardOnly(btn) {
            if (btn) btn.innerText = 'Loading...';
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                try {
                    const res = await fetch(APPS_SCRIPT_URL);
                    if (res.ok) {
                        const cloudData = await res.json();
                        if (Array.isArray(cloudData)) {
                            leaderboardDB = cloudData;
                            try {
                                localStorage.setItem('imd_ai_leaderboard', JSON.stringify(leaderboardDB));
                            } catch (e) {}
                        }
                    }
                } catch (e) {
                    console.warn('Could not fetch leaderboard:', e);
                }
            }
            renderLeaderboardOnly();
        }

        function renderLeaderboardOnly() {
            const sorted = [...leaderboardDB].sort((a, b) => (b.score || 0) - (a.score || 0));

            let rowsHTML = sorted.length === 0
                ? `<div class="p-8 text-center text-gray-400 text-xs italic bg-gray-50 rounded-lg border border-dashed border-gray-200">
                    No scores recorded yet.<br>Be the first to take the challenge!
                   </div>`
                : sorted.map((entry, index) => {
                    const isMe = state.nickname && entry.name && entry.name.toLowerCase() === state.nickname.toLowerCase();
                    const rankMedal = index === 0 ? '1' : index === 1 ? '2' : index === 2 ? '3' : `${index + 1}.`;
                    const cardStyle = index === 0 
                        ? 'bg-amber-50/80 border-amber-200 text-amber-950' 
                        : index === 1 
                        ? 'bg-slate-50 border-slate-200 text-slate-900' 
                        : index === 2 
                        ? 'bg-orange-50/60 border-orange-200 text-orange-950' 
                        : isMe 
                        ? 'bg-blue-50 border-blue-200' 
                        : 'bg-white border-gray-100 hover:border-gray-200';

                    return `
                    <div class="flex justify-between items-center p-3 rounded-lg border ${cardStyle} mb-2 shadow-xs transition">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="font-bold text-sm w-6 text-center shrink-0 ${index < 3 ? 'text-base font-extrabold text-[#003366]' : 'text-gray-500 font-mono'}">${rankMedal}</span>
                            <div class="truncate">
                                <div class="font-bold text-gray-800 text-sm truncate ${isMe ? 'imd-text-blue' : ''}">
                                    ${entry.name || 'Anonymous'} ${isMe ? '<span class="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold ml-1">You</span>' : ''}
                                </div>
                                <div class="text-[11px] text-gray-500 font-normal">
                                    ${entry.correct !== undefined && entry.total ? `${entry.correct}/${entry.total} correct` : ''}
                                    ${entry.correct !== undefined && entry.total && entry.time ? ' • ' : ''}
                                    ${entry.time ? `${entry.time}s` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="text-right shrink-0 ml-2">
                            <span class="text-base font-black text-gray-900">${entry.score}</span>
                            <span class="text-[10px] text-gray-500 font-normal">pts</span>
                        </div>
                    </div>
                    `;
                }).join('');

            contentDiv.innerHTML = `
            <div class="fade-in flex flex-col h-full">
                <!-- Header -->
                <div class="flex items-center justify-between mb-3 px-1">
                    <button onclick="resetApp()" class="text-xs font-semibold text-gray-600 hover:text-gray-900 flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg transition">
                        ← Back
                    </button>
                    <div class="text-center">
                        <h2 class="text-lg font-bold imd-text-blue">Live Leaderboard</h2>
                        <p class="text-[11px] text-gray-500">${sorted.length} Participant${sorted.length === 1 ? '' : 's'}</p>
                    </div>
                    <button onclick="refreshLeaderboardOnly(this)" class="text-xs font-semibold text-blue-700 hover:text-blue-900 flex items-center gap-1 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                        Refresh
                    </button>
                </div>

                <!-- Scrollable Standings -->
                <div class="flex-grow overflow-y-auto pr-1 mb-4 rounded-lg">
                    ${rowsHTML}
                </div>

                <!-- Bottom Button -->
                <div class="mt-auto pt-2">
                    <button onclick="resetApp()" class="btn-action-primary w-full imd-blue text-white hover:bg-[#001444] shadow">
                        PLAY CHALLENGE
                    </button>
                </div>
            </div>
            `;
        }

        // --- Logic ---

        function startGame() {
            const input = document.getElementById('nickname-input').value.trim();
            if (!input) {
                alert("Please enter a nickname!");
                return;
            }

            state.nickname = input;
            state.score = 0;
            state.correctCount = 0;
            state.answers = [];
            state.gameItems = shuffleArray(dataset);
            state.currentIndex = 0;
            state.startTime = Date.now();
            state.screen = 'PLAYING';

            // Start Timer
            state.timerInterval = setInterval(updateTimer, 100);

            renderPlaying();
        }

        function updateTimer() {
            if (state.screen !== 'PLAYING') return;
            const now = Date.now();
            state.timeElapsed = ((now - state.startTime) / 1000).toFixed(1);
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                timerEl.innerText = state.timeElapsed;
            }
        }

        function makeGuess(guess) {
            const currentItem = state.gameItems[state.currentIndex];
            const isCorrect = (guess === currentItem.answer);

            if (isCorrect) {
                state.correctCount++;
                state.score += 100;
            }

            // Track individual answer for the review screen
            state.answers.push({
                id: currentItem.id,
                guess: guess,
                correct: isCorrect,
                item: currentItem
            });

            state.currentIndex++;

            if (state.currentIndex >= state.gameItems.length) {
                endGame();
            } else {
                renderPlaying();
            }
        }

        async function endGame() {
            clearInterval(state.timerInterval);
            state.screen = 'SYNCING';
            renderSyncing();

            // Calculate final score with speed bonus (assumes a 30 second par time)
            const timeBonus = Math.max(0, Math.floor((30 - parseFloat(state.timeElapsed)) * 10));
            state.score += timeBonus;

            const totalCount = state.gameItems ? state.gameItems.length : dataset.length;
            const payload = {
                nickname: state.nickname,
                score: state.score,
                correct: state.correctCount,
                total: totalCount,
                time: state.timeElapsed,
                timestamp: new Date().toISOString()
            };

            // 1. Send data to Google Sheets via Apps Script Web App
            try {
                if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // Prevents browser CORS blocks for simple one-way logging
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    });
                } else {
                    await new Promise(resolve => setTimeout(resolve, 800));
                }
            } catch (error) {
                console.error("Error saving to Google Sheets:", error);
            }

            // Immediately record locally
            leaderboardDB.push({
                name: state.nickname,
                score: state.score,
                time: state.timeElapsed
            });

            // 2. Fetch live updated global leaderboard from Google Sheet
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                try {
                    // Small delay to allow the Google Sheet row to append
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const res = await fetch(APPS_SCRIPT_URL);
                    if (res.ok) {
                        const cloudData = await res.json();
                        if (Array.isArray(cloudData) && cloudData.length > 0) {
                            leaderboardDB = cloudData;
                        }
                    }
                } catch (fetchErr) {
                    console.warn('Could not fetch cloud leaderboard:', fetchErr);
                }
            }

            try {
                localStorage.setItem('imd_ai_leaderboard', JSON.stringify(leaderboardDB));
            } catch (e) {
                console.warn('Could not save to localStorage', e);
            }

            state.screen = 'LEADERBOARD';
            renderLeaderboard();
        }

        function resetApp() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const modal = document.getElementById('credits-modal');
            if (modal) {
                modal.classList.add('hidden');
            }
            state = {
                screen: 'ONBOARDING',
                nickname: '',
                score: 0,
                correctCount: 0,
                gameItems: [],
                answers: [],
                currentIndex: 0,
                startTime: 0,
                timerInterval: null,
                timeElapsed: 0
            };
            renderOnboarding();
        }

        // Preload live leaderboard from Google Sheets on load
        if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
            fetch(APPS_SCRIPT_URL)
                .then(res => res.json())
                .then(cloudData => {
                    if (Array.isArray(cloudData) && cloudData.length > 0) {
                        leaderboardDB = cloudData;
                        try {
                            localStorage.setItem('imd_ai_leaderboard', JSON.stringify(leaderboardDB));
                        } catch (e) {}
                    }
                })
                .catch(() => {});
        }

        // Init
        renderOnboarding();
    </script>

</body>

</html>
